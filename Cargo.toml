[workspace]
resolver = "3"
members = ["packages/hxn-file", "packages/hxn-assets", "adapters/kyugraph-jit", "adapters/kyugraph"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hx-n/hxn-assets"

[workspace.dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.10" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.10" }
serde_json = "1"
