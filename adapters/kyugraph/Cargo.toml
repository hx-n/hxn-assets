[package]
name = "hxn-assets-kyugraph"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "KyuGraph projection core used by the installed hxn-assets package"


[dependencies]
kyu-graph = { git = "https://github.com/offbit-ai/kyugraph.git", rev = "64f41a248a9ed5d30baf5c04ba551b5cb04f342a", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = ["jit"]
jit = ["kyu-graph/jit"]
