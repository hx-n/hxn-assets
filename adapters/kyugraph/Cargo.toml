[package]
name = "hxn-assets-kyugraph"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "KyuGraph projection core used by the installed hxn-assets package"


[dependencies]
kyu-graph = { git = "https://github.com/offbit-ai/kyugraph.git", rev = "81bb070d8318f2e2fdb32163762f2af4a7b8efb6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = ["jit"]
jit = ["kyu-graph/jit"]
