[package]
name = "hxn-assets-jit-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed assets and an embedded knowledge graph for Haxe"
keywords = ["hxcpp", "hashlink", "native", "cross", "wasm"]
publish = false

[lib]
name = "hxn_assets_jit_build"
path = "../../packages/hxn-assets/native-src/lib.rs"

[package.metadata.hxn]
library = "assets_jit"
haxelib = "hxn-assets"
contributors = ["darmie"]
releasenote = "Built-in Haxe knowledge graph with JIT and scalar variants."
haxe = "../../tests/knowledge-native"
haxe-flags = ["-lib", "hxn:0.3.10", "-lib", "format:3.8.0", "-cp", "../../examples/knowledge", "-D", "hxn_assets_dir=../../examples/knowledge/assets", "-lib", "hxn-file", "-cp", "../../packages/hxn-assets/src"]

[dependencies]
hxn.workspace = true
hxn-future.workspace = true
serde_json.workspace = true
hxn-assets-kyugraph = { path = "../kyugraph", default-features = false }

[features]
default = ["jit"]
jit = ["hxn-assets-kyugraph/jit"]
