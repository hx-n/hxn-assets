name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    name: package, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, jit: true }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, jit: true }
          - { os: macos-latest, name: macos-aarch64, jit: true }
          - { os: windows-latest, name: windows-x86_64, jit: true }
          - { os: macos-latest, name: macos-x86_64, runtimes: cpp, target: x86_64-apple-darwin, jit: true }
          - { os: macos-latest, name: ios, runtimes: hl cpp, target: aarch64-apple-ios }
          - { os: macos-latest, name: ios-simulator, runtimes: hl cpp, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, name: android, runtimes: hl cpp, target: aarch64-linux-android, jit: true }
          - { os: ubuntu-latest, name: android-x86_64, runtimes: hl cpp, target: x86_64-linux-android, jit: true }
          - { os: ubuntu-latest, name: ash-wasm-threads, runtimes: hl, wasm: true, threads: true }
          - { os: ubuntu-latest, name: emcc-wasm, runtimes: cpp, wasm: true, emcc: true }
          - { os: ubuntu-latest, name: emcc-wasm-threads, runtimes: cpp, wasm: true, threads: true, emcc: true }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: package
      - run: python3 scripts/third_party_notices.py --output packages/hxn-file/third-party --check
      - run: python3 scripts/third_party_notices.py --output packages/hxn-assets/third-party/native --check
      - if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      # The NDK's compiler, archiver and linker for the Android triple, at API level 26.
      - if: contains(matrix.target, 'android')
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          triple=${{ matrix.target }}
          name=${triple//-/_}
          echo "CC_$name=$ndk/${triple}26-clang" >> "$GITHUB_ENV"
          echo "AR_$name=$ndk/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${name^^}_LINKER=$ndk/${triple}26-clang" >> "$GITHUB_ENV"
      - if: matrix.emcc
        run: |
          rustup target add wasm32-unknown-emscripten
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Package file and graph bindings
        run: |
          if [ -f "$RUNNER_TEMP/emsdk/emsdk_env.sh" ]; then source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; fi
          python3 tests/release/build.py --runtimes ${{ matrix.runtimes || 'hl cpp' }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.wasm && '--wasm' || '' }} ${{ matrix.threads && '--threads' || '' }} ${{ matrix.jit && '--jit' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: target/release-part
  haxelibs:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: target/release-parts
      - run: python3 tests/release/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: haxelibs
          path: target/release-dist/*.zip
  try-native:
    name: installed, ${{ matrix.os }}
    needs: haxelibs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: package
      - uses: actions/download-artifact@v4
        with:
          name: haxelibs
          path: target/release-dist
      - run: python3 tests/release/run.py native
  try-browser:
    name: installed, ${{ matrix.mode }}, Chrome
    needs: haxelibs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [wasm, emcc, emcc-threads]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: browser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: haxelibs
          path: target/release-dist
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          unset CC CXX
          python3 tests/release/run.py "${{ matrix.mode }}" --chrome "$(command -v google-chrome)"
  publish:
    needs: [try-native, try-browser]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: haxelibs
          path: target/release-dist
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: |
          test -n "$HAXELIB_PASSWORD" || { echo "::error::Configure HAXELIB_PASSWORD before publishing"; exit 1; }
          python3 tests/release/package.py --check-dist
          cd target/release-dist
          sha256sum *.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --clobber --pattern 'hxn-file-*.zip' --pattern 'hxn-assets-*.zip' --pattern SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "hxn-file and hxn-assets ${GITHUB_REF_NAME#v}" --notes-file ../../tests/release/notes.md *.zip SHA256SUMS
          fi
          python3 ../../tests/release/publish.py --tag "$GITHUB_REF_NAME" --dist .
