name: Publish existing release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - name: Download the published archives
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+",os.environ["RELEASE_TAG"])'
          gh release download "$RELEASE_TAG" --pattern 'hxn-file-*.zip' --pattern 'hxn-assets-*.zip' --pattern SHA256SUMS --dir target/release-dist
          python3 tests/release/publish.py --tag "$RELEASE_TAG" --check-only
      - name: Submit missing Haxelib versions
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: python3 tests/release/publish.py --tag "$RELEASE_TAG"
